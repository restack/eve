apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve
  namespace: eve-system
  labels:
    app.kubernetes.io/name: eve
    app.kubernetes.io/component: bot
---
apiVersion: v1
kind: Secret
metadata:
  name: eve-secrets
  namespace: eve-system
type: Opaque
stringData:
  SLACK_APP_TOKEN: "xapp-1-XXXXXXXXX"
  SLACK_BOT_TOKEN: "xoxb-XXXXXXXXX"
  LLM_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eve-config
  namespace: eve-system
data:
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "http://qwen.home.lab:8003"
  LLM_MODEL: "qwen3-coder"

  # Comma-separated list of MCP server URLs
  # Example: http://mcp-k8s:8080,http://mcp-github:8080
  MCP_SERVERS: "http://mcp-kubernetes.eve-system:8080,http://mcp-github.eve-system:8080"

  ALLOWED_USER_IDS: ""
  ALLOWED_CHANNEL_IDS: ""
  RECIPE_MAPPINGS: "pod_restart:restart-pod-workflow"

