apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  labels:
    app: qdrant
data:
  production.yaml: |
    storage:
      storage_path: /qdrant/storage

    service:
      host: 0.0.0.0
      http_port: 6333
      grpc_port: 6334
      max_request_size_mb: 32
      enable_cors: true

    log_level: INFO

    telemetry_disabled: true

    optimizers:
      indexing_threshold: 10000
      flush_interval_sec: 30
      max_optimization_threads: 2

    hnsw_index:
      m: 16
      ef_construct: 100
      full_scan_threshold: 10000
